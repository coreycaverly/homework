# Subject registry. Drives the whole site:
#   index.md (root)      -> lists the AREAS below (one row each)
#   <area.slug>/index.md -> an area page listing that area's subjects (only needed when an
#                           area has more than one subject; single-subject areas link
#                           straight to the subject landing)
#   <slug>/index.md       -> the subject landing (reads its own entry by slug)
# The homework-intake skill edits THIS file. slug = folder name; added = date added.
- area: English
  slug: english
  emoji: "📚"
  subjects:
