# The subject registry. Builds the hub (index.md) AND each subject's landing page
# (<slug>/index.md reads its own entry by slug). The homework-intake skill edits THIS
# file to add a subject: append an entry under the matching area, or add a new area block.
# slug must equal the folder name. added = the date it was added.
- area: English
  emoji: "📚"
  subjects:
    - { name: Grammar Detective, slug: grammar, emoji: "📝", added: 2026-11-03, blurb: "Find and fix adjective, adverb, and article errors on your own." }
    - { name: Editor Detective,  slug: editor,  emoji: "✏️", added: 2026-11-05, blurb: "Conjunctions, prepositions, and interjections — find the mistake, fix it." }
    - { name: Writing Detective, slug: writing, emoji: "✍️", added: 2026-11-05, blurb: "Full sentences, homophones, and explaining your answer — the points you lose in every class." }
