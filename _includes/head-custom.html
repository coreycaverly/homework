<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
  /* site-fonts: Lexend for reading ease (ADHD-friendly), Bricolage Grotesque for headings */
  body { font-family: "Lexend", "Open Sans", system-ui, sans-serif; }
  h1, h2, h3, h4, h5, h6,
  .page-header .project-name, .page-header .project-tagline {
    font-family: "Bricolage Grotesque", "Lexend", system-ui, sans-serif;
  }

  /* homework-banner: make the cayman header look like ruled notebook paper */
  .page-header {
    color: #16233b;
    background-color: #fdfcf3;
    background-image:
      /* red left margin line */
      linear-gradient(to right,
        transparent 0 2.75rem,
        rgba(214, 69, 69, .55) 2.75rem calc(2.75rem + 2px),
        transparent calc(2.75rem + 2px)),
      /* blue horizontal rules */
      repeating-linear-gradient(to bottom,
        transparent 0 2.25rem,
        rgba(60, 110, 190, .28) 2.25rem calc(2.25rem + 1px),
        transparent calc(2.25rem + 1px));
    border-bottom: 1px solid rgba(0, 0, 0, .08);
  }
  .page-header .site-home {
    display: inline-block;
    margin-bottom: .5rem;
    font-weight: 600;
    font-size: .95rem;
    color: #2d3f63;
    text-decoration: none;
    opacity: .85;
  }
  .page-header .site-home:hover { opacity: 1; text-decoration: underline; }
  .page-header .project-name {
    color: #16233b;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .65);
  }
  .page-header .project-tagline {
    color: #3f5168;
    opacity: .9;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
  }

  /* auth control (top-right of the banner); empty until Firebase is configured */
  .page-header { position: relative; }
  .hw-auth { position: absolute; top: .6rem; right: .9rem; display: flex; align-items: center;
    gap: .5rem; font-size: .85rem; color: #2d3f63; }
  .hw-auth:empty { display: none; }
  .hw-who { font-weight: 600; }
  .hw-badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: .68rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: #e6e9f5; color: #3a2f6b; }
  .hw-link { color: #2d3f63; font-weight: 600; text-decoration: underline; }
  .hw-btn { font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; color: #16233b;
    background: rgba(255,255,255,.85); border: 1px solid rgba(20,30,60,.25); border-radius: 9px;
    padding: 6px 12px; min-height: 32px; }
  .hw-btn:hover { background: #fff; border-color: #0d9488; }
  .hw-btn.big { font-size: 1rem; padding: 12px 18px; min-height: 44px; }
  @media (max-width: 540px) {
    .hw-auth { position: static; justify-content: flex-end; margin: 0 0 .25rem; }
  }

  /* answer-key gating: hide content until a parent/admin is verified */
  html.hw-gated #content { visibility: hidden; }
  .hw-lock { max-width: 520px; margin: 1.5rem auto; padding: 1.5rem 1.25rem; text-align: center;
    background: #fff; border: 1px solid rgba(20,30,60,.12); border-radius: 16px;
    box-shadow: 0 1px 3px rgba(20,30,60,.06); }
  .hw-lock h2 { margin-top: 0; }
  .hw-lock code { font-size: .8rem; word-break: break-all; background: #f1f3fa; padding: 2px 6px; border-radius: 6px; }
  .hw-muted { color: #8b93b0; }
</style>
