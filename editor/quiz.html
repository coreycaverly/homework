{% raw %}

<style>
/* Find-and-fix quiz, themed to sit inside the cayman page. Color = word type:
   Conjunction teal, Preposition violet, Interjection rose. */
#app{max-width:640px;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:20px}
#app *{box-sizing:border-box}
.quiz-nav{text-align:center;margin-top:28px}
:root{
  --bg:#F7F8FC; --card:#FFFFFF; --ink:#1A2042; --muted:#5B6386; --line:#DCE0EC; --hover:#EEF1F8;
  --conj:#0D9488; --conj-soft:#D6F0EC; --prep:#9333EA; --prep-soft:#EEE3FB; --interj:#DB2777; --interj-soft:#FBE1EE;
  --hl:#FFE14D; --hl-ink:#1A2042; --miss:#D93A4A; --miss-soft:#FCE4E7; --good:#0D9488;
}
#app, #app button{font-family:inherit}
#app p{margin:0}
#app button{color:inherit;cursor:pointer;border:0;background:none}
#app button:focus-visible{outline:3px solid var(--conj);outline-offset:2px}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .1em}
.intro{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.big-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;font-weight:600;font-size:1.15rem;transition:transform .12s}
.big-btn small{display:block;font-weight:400;font-size:.85rem;opacity:.8}
.big-btn:hover{transform:translateY(-2px)}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{border-radius:14px;padding:14px 10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic span{font-size:.72rem;font-weight:400}
.t-conj{background:var(--conj-soft);color:var(--conj)} .t-prep{background:var(--prep-soft);color:var(--prep)} .t-interj{background:var(--interj-soft);color:var(--interj)}
.c-conj{color:var(--conj)} .c-prep{color:var(--prep)} .c-interj{color:var(--interj)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{padding:8px 10px;border-radius:10px;color:var(--muted);font-size:.95rem}
.back:hover{background:var(--hover)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)} .dot.now{background:var(--ink)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.badge.mystery{background:var(--hover);color:var(--muted)}
.prompt{font-weight:600;font-size:1.05rem}
.sentence{display:flex;flex-wrap:wrap;gap:4px 2px;font-size:clamp(1.2rem,4.4vw,1.45rem);line-height:1.6}
.word{padding:2px 8px;border-radius:10px;border:2px solid transparent;font-weight:500;min-height:44px}
.sentence.live .word:hover{background:var(--hover)}
.word.oops{background:var(--miss-soft);animation:shake .35s}
.word.look{border-color:var(--hl);animation:pulse 1s infinite}
.word.found{background:var(--hl);color:var(--hl-ink);text-decoration:line-through;text-decoration-thickness:2px}
.word.fixed{font-weight:600;color:var(--hl-ink);background:var(--hl)}
.word.static{cursor:default}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choice{border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:1.1rem;background:var(--card);min-height:52px}
.choice:hover{border-color:var(--ink)}
.choice.t-conj{background:var(--conj-soft)} .choice.t-prep{background:var(--prep-soft)} .choice.t-interj{background:var(--interj-soft)}
.choice.oops{border-color:var(--miss);animation:shake .35s}
.nomistake{align-self:flex-start;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-weight:500}
.nomistake:hover{border-color:var(--muted);color:var(--ink)}
.nomistake.oops{border-color:var(--miss);color:var(--miss);animation:shake .35s}
.hint{background:var(--hover);border-radius:12px;padding:12px 14px;font-size:.95rem}
.hint b{font-weight:600}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.result.conj{background:var(--conj-soft)} .result.prep{background:var(--prep-soft)} .result.interj{background:var(--interj-soft)}
.result strong{font-weight:800;font-size:1.2rem}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600;font-size:1.1rem}
.stars{font-size:2.2rem;letter-spacing:4px;color:#E8B400}
.stars .off{color:var(--line)}
.pop{animation:pop .4s}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.center{align-items:center;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,225,77,.5)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.topics{grid-template-columns:1fr}.topic{flex-direction:row;justify-content:space-between;padding:14px 16px}}
</style>

<script>
// A fix of DEL means "this word should not be there": the button reads "(cross it out)" and the word is struck through.
const DEL="(cross it out)";
const BANK=[
 // CONJUNCTIONS
 {t:'conj',s:"I wanted to play outside, and it was raining.",w:"and",fix:"but",o:["or","nor"],why:"The two ideas disagree (wanting to play vs. the rain), so use but to show contrast."},
 {t:'conj',s:"She is neither tall or short.",w:"or",fix:"nor",o:["and","but"],why:"Neither pairs with nor: neither tall nor short. That's a correlative pair."},
 {t:'conj',s:"Either you clean your room nor you lose your phone.",w:"nor",fix:"or",o:["and","but"],why:"Either pairs with or: either… or. (Neither pairs with nor.)"},
 {t:'conj',s:"He didn't study, but he failed the test.",w:"but",fix:"so",o:["or","nor"],why:"Not studying caused the failing, so use so to show the result."},
 {t:'conj',s:"You can have cake and ice cream, but not both.",w:"and",fix:"or",o:["nor","so"],why:"\"Not both\" means a choice between two — use or: cake or ice cream."},
 {t:'conj',s:"We can walk or we can take the bus.",w:null,why:"No mistake! Or correctly shows a choice between two options."},
 {t:'conj',s:"We stayed inside unless the storm passed.",w:"unless",fix:"until",o:["nor","although"],why:"Until means up to that time: you stay in up to the moment the storm passes. Unless means except if."},
 {t:'conj',s:"The coach wants both speed or teamwork from us.",w:"or",fix:"and",o:["nor","but"],why:"Both pairs with and: both speed and teamwork."},
 {t:'conj',s:"Not only did we finish early, and we also got an A.",w:"and",fix:"but",o:["or","so"],why:"Not only pairs with but also: not only… but we also got an A."},
 {t:'conj',s:"After the movie ended, we walked home.",w:null,why:"No mistake! After fits the time, and the comma comes right where the first part ends."},
 {t:'conj',s:"I forgot my umbrella, for I got soaked on the walk home.",w:"for",fix:"so",o:["nor","or"],why:"Getting soaked is the RESULT of forgetting the umbrella. Results use so; reasons use for or because."},
 {t:'conj',s:"We canceled the picnic, so the forecast called for thunderstorms.",w:"so",fix:"because",o:["nor","or"],why:"The storm forecast is the REASON for canceling, so use because. So would point to a result."},
 {t:'conj',s:"Text me why you get to the station.",w:"why",fix:"when",o:["whether","although"],why:"It's about a time, so use when: text me when you get there."},
 {t:'conj',s:"She speaks not only Spanish and also French.",w:"and",fix:"but",o:["or","nor"],why:"Not only always teams up with but also: not only Spanish but also French."},
 {t:'conj',s:"We stayed inside, for the roads were covered in ice.",w:null,why:"No mistake! Here for means because: the icy roads are the reason you stayed in."},
 // PREPOSITIONS
 {t:'prep',s:"She is really good in math.",w:"in",fix:"at",o:["on","to"],why:"We say good AT something: good at math."},
 {t:'prep',s:"We arrived to the school early.",w:"to",fix:"at",o:["in","on"],why:"You arrive AT a place: arrived at school."},
 {t:'prep',s:"This book is different than the movie.",w:"than",fix:"from",o:["of","to"],why:"Standard English uses different FROM."},
 {t:'prep',s:"Let's meet at Friday afternoon.",w:"at",fix:"on",o:["in","to"],why:"Use ON with days of the week: on Friday."},
 {t:'prep',s:"I am interested on science.",w:"on",fix:"in",o:["at","to"],why:"We say interested IN something."},
 {t:'prep',s:"The cat is hiding under the bed.",w:null,why:"No mistake! Under is the right preposition for where the cat is."},
 {t:'prep',s:"The cat jumped off of the kitchen counter.",w:"of",fix:DEL,o:["from","to"],why:"Off already does the job. Off of has one word too many, so cross out of."},
 {t:'prep',s:"Where did you leave your shoes at?",w:"at",fix:DEL,o:["in","to"],why:"Where already asks for the place. The at at the end is extra, so cross it out."},
 {t:'prep',s:"The coach handed out snacks between all six players.",w:"between",fix:"among",o:["across","beside"],why:"Six players is more than two. Between is for 2; among is for 3 or more."},
 {t:'prep',s:"We hung the banner among the two doors.",w:"among",fix:"between",o:["during","of"],why:"Only two doors, so use between. Among is for 3 or more."},
 {t:'prep',s:"The book slid for the shelf and hit the floor.",w:"for",fix:"off",o:["about","of"],why:"Things slide or fall OFF a shelf. Off shows moving away from a surface."},
 {t:'prep',s:"A spider web is made up from thin silk threads.",w:"from",fix:"of",o:["at","on"],why:"The set phrase is made up OF: a web is made up of threads."},
 {t:'prep',s:"My shoes were covered over mud after the hike.",w:"over",fix:"in",o:["at","off"],why:"We say covered IN (or with) mud."},
 {t:'prep',s:"I caught a cold of my little sister.",w:"of",fix:"from",o:["at","on"],why:"You catch something FROM someone: the cold came from your sister."},
 // INTERJECTIONS
 {t:'interj',s:"Hooray, I lost my homework!",w:"Hooray",fix:"Oh no",o:["Yippee","Yay"],why:"Hooray shows joy, but losing homework is bad news — use Oh no."},
 {t:'interj',s:"Ouch, we won the big game!",w:"Ouch",fix:"Hooray",o:["Oops","Ow"],why:"Ouch means pain; winning is exciting, so Hooray fits the feeling."},
 {t:'interj',s:"Ugh, this chocolate cake is delicious!",w:"Ugh",fix:"Mmm",o:["Yuck","Eww"],why:"Ugh shows disgust; a delicious cake calls for Mmm."},
 {t:'interj',s:"Wow, that magic trick was amazing!",w:null,why:"No mistake! Wow fits amazement perfectly."}
];
const NAME={conj:"Conjunction",prep:"Preposition",interj:"Interjection"};
const HINT={
 conj:"<b>Conjunction hunt:</b> look at the joining words (and, but, or, so, nor). Does it match the meaning — contrast (but), choice (or), result (so)? Correlatives must pair: neither…nor, either…or.",
 prep:"<b>Preposition hunt:</b> look at the little position words (in, on, at, to, from). Some go with set phrases: good AT, arrive AT, interested IN, different FROM, ON a day. Some are EXTRA: read it without the little word. Between = 2, among = 3 or more.",
 interj:"<b>Interjection hunt:</b> find the feeling word at the start (Wow, Ouch, Hooray, Ugh). Does the feeling match what happens?"
};
const RULE={
 conj:"Conjunctions join ideas: and (adds), but (contrasts), or (choice), so (result). Correlatives pair up: neither…nor, either…or.",
 prep:"Prepositions show position or direction: good at, arrive at, interested in, different from, on + a day.",
 interj:"Interjections show feeling (Wow! Ouch! Hooray!). Match the feeling to the moment."
};

const app=document.getElementById('app');
let S=null;
const stats=load();
function load(){try{return JSON.parse(localStorage.getItem('ed-stats'))||{cases:0,stars:0}}catch(e){return{cases:0,stars:0}}}
function save(){try{localStorage.setItem('ed-stats',JSON.stringify(stats))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=w=>w.replace(/[.,!?;:"]/g,'');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function home(){
  S=null;
  app.innerHTML=`
  <p class="intro muted">Tap the word that's wrong, pick the fix. Short rounds — about 3 minutes.</p>
  <button class="big-btn" data-act="start" data-mode="mix">
    <div>Quick round<small>5 sentences · all three types · about 3 minutes</small></div><span aria-hidden="true">→</span>
  </button>
  <div class="card">
    <span class="label">Practice one type (6 sentences)</span>
    <div class="topics">
      <button class="topic t-conj" data-act="start" data-mode="conj">Conjunctions<span>and · but · or · so</span></button>
      <button class="topic t-prep" data-act="start" data-mode="prep">Prepositions<span>in · on · at · to</span></button>
      <button class="topic t-interj" data-act="start" data-mode="interj">Interjections<span>Wow! · Ouch!</span></button>
    </div>
  </div>
  <div class="card">
    <span class="label">How it works</span>
    <ol class="steps">
      <li><span><b>Tap</b> the word that's wrong. Watch out: some sentences are tricks with no mistake.</span></li>
      <li><span><b>Pick</b> the fix.</span></li>
      <li><span>In a quick round, <b>name the type</b> for a bonus star.</span></li>
    </ol>
    <div class="stats muted"><span>Rounds done: <b>${stats.cases}</b></span><span>Stars earned: <b>${stats.stars}</b> ★</span></div>
  </div>`;
}

function start(mode){
  const pool=mode==='mix'?BANK:BANK.filter(q=>q.t===mode);
  const n=mode==='mix'?5:6;
  const errs=shuffle(pool.filter(q=>q.w)), none=shuffle(pool.filter(q=>!q.w));
  const qs=errs.slice(0,n-1); qs.push(none.length&&Math.random()<.6?none[0]:errs[n-1]);
  S={mode,qs:shuffle(qs),i:0,stars:0,max:0,missed:new Set()};
  setupQ();
}
function setupQ(){
  const q=S.qs[S.i];
  Object.assign(S,{phase:'find',miss:0,fixMiss:0,typeMiss:0,msg:'',opts:q.w?shuffle([q.fix,...q.o]):[],pts:0,oops:null});
  S.toks=q.s.split(' '); S.target=q.w?S.toks.findIndex(t=>clean(t)===q.w):-1;
  S.max+=S.mode==='mix'?3:2;
  render();
}
function render(){
  const q=S.qs[S.i], mix=S.mode==='mix', ph=S.phase;
  const dots=S.qs.map((_,k)=>`<span class="dot ${k<S.i?'done':k===S.i?'now':''}"></span>`).join('');
  const words=S.toks.map((t,k)=>{
    let cls='word', txt=t;
    if(k===S.target&&ph==='fix')cls+=' found static';
    else if(k===S.target&&(ph==='type'||ph==='done')){if(q.fix===DEL)cls+=' found static';else{cls+=' fixed static';txt=t.replace(q.w,q.fix)}}
    else if(ph!=='find')cls+=' static';
    if(ph==='find'&&k===S.target&&S.miss>=3)cls+=' look';
    if(S.oops===k)cls+=' oops';
    return `<button class="${cls}" data-act="word" data-k="${k}" ${ph!=='find'?'tabindex="-1"':''}>${esc(txt)}</button>`;
  }).join('');
  let body='';
  if(ph==='find'){
    body=`<p class="prompt">Tap the word that's wrong.</p>
    <div class="sentence live">${words}</div>
    <button class="nomistake ${S.oops==='none'?'oops':''}" data-act="none">No mistake here</button>`;
  }else if(ph==='fix'){
    body=`<p class="prompt">Nice find! Pick the fix:</p><div class="sentence">${words}</div>
    <div class="choices">${S.opts.map((o,k)=>`<button class="choice ${S.oops==='o'+k?'oops':''}" data-act="fix" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  }else if(ph==='type'){
    body=`<p class="prompt">Bonus star: what kind of word was it?</p><div class="sentence">${words}</div>
    <div class="choices">${['conj','prep','interj'].map(t=>`<button class="choice t-${t} ${S.oops==='t'+t?'oops':''}" data-act="type" data-t="${t}">${NAME[t]}</button>`).join('')}</div>`;
  }else{
    const of=mix?3:2;
    body=`<div class="sentence">${words}</div>
    <div class="result ${q.t}"><strong class="pop">${S.pts===of?'Perfect!':S.pts>0?'Nice!':'Got it.'} ${'★'.repeat(S.pts)}</strong><p>${esc(q.why)}</p></div>
    <button class="next" data-act="next">${S.i<S.qs.length-1?'Next sentence →':'See my results →'}</button>`;
  }
  const badge=(!mix||ph==='done')?`<span class="badge t-${q.t}">${NAME[q.t]}</span>`:`<span class="badge mystery">Mixed</span>`;
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="home">← Home</button><div class="dots" role="img" aria-label="Sentence ${S.i+1} of ${S.qs.length}">${dots}</div><span class="score">★ ${S.stars}</span></div>
  <section class="card">${badge}${body}${S.msg?`<div class="hint" role="status">${S.msg}</div>`:''}</section>`;
  S.oops=null;
}
function findMissHint(q){
  S.miss++;
  if(!q.w){S.msg=S.miss===1?"Read it out loud slowly, one word at a time. Does every word sound right?":"This might be a trick sentence. If nothing is wrong, tap <b>No mistake here</b>.";return}
  if(S.mode==='mix'&&S.miss===1)S.msg="Read it out loud with your finger under each word. Which one sounds off?";
  else S.msg=HINT[q.t]+(S.miss>=3?" <b>Look at the glowing word.</b>":"");
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='home')return home();
  if(a==='start')return start(b.dataset.mode);
  const q=S&&S.qs[S.i]; if(!q)return;
  if(a==='word'&&S.phase==='find'){
    const k=+b.dataset.k;
    if(k===S.target){ if(S.miss===0)S.pts++; else S.missed.add(q.t); S.phase='fix'; S.msg=''; }
    else{ S.oops=k; findMissHint(q); }
    return render();
  }
  if(a==='none'&&S.phase==='find'){
    if(!q.w){ if(S.miss===0)S.pts+=S.mode==='mix'?3:2; else{S.pts+=1;S.missed.add(q.t)} S.phase='done'; S.msg=''; }
    else{ S.oops='none'; S.miss++; S.msg="There IS a mistake hiding in this one. "+(S.mode==='mix'?"Read it out loud slowly.":HINT[q.t]); }
    return render();
  }
  if(a==='fix'&&S.phase==='fix'){
    const o=S.opts[+b.dataset.k];
    if(o===q.fix){ if(S.fixMiss===0)S.pts++; else S.missed.add(q.t); S.msg=''; S.phase=S.mode==='mix'?'type':'done'; }
    else{ S.oops='o'+b.dataset.k; S.fixMiss++; S.msg="Not quite. Read the sentence out loud with each choice. "+(S.fixMiss>1?HINT[q.t]:''); }
    return render();
  }
  if(a==='type'&&S.phase==='type'){
    if(b.dataset.t===q.t){ if(S.typeMiss===0)S.pts++; S.msg=''; S.phase='done'; }
    else{ S.oops='t'+b.dataset.t; S.typeMiss++; S.msg="Look at the fixed word. Is it a joining word (<b>Conjunction</b>), a position word like in/on/at (<b>Preposition</b>), or a feeling word like Wow/Ouch (<b>Interjection</b>)?"; }
    return render();
  }
  if(a==='next'){
    S.stars+=S.pts;
    if(S.i<S.qs.length-1){S.i++;return setupQ()}
    return finish();
  }
});
function finish(){
  stats.cases++; stats.stars+=S.stars; save();
  try{localStorage.setItem('hw-done-editor',new Date().toISOString().slice(0,10))}catch(e){}
  const pct=S.stars/S.max, on=Math.min(5,Math.round(pct*5));
  const head=pct>=.9?"Amazing!":pct>=.6?"Nice work!":"Good work sticking with it!";
  const rules=[...S.missed].map(t=>`<li><b class="c-${t}">${NAME[t]}s:</b> ${RULE[t]}</li>`).join('');
  app.innerHTML=`
  <section class="card center">
    <span class="label">Results</span>
    <h2>${head}</h2>
    <div class="stars pop" aria-hidden="true">${'★'.repeat(on)}<span class="off">${'★'.repeat(5-on)}</span></div>
    <p><b>${S.stars}</b> of ${S.max} stars</p>
  </section>
  ${rules?`<section class="card"><span class="label">Rules to remember</span><ul class="rules">${rules}</ul></section>`:''}
  <button class="big-btn" data-act="start" data-mode="${S.mode}"><div>Another round<small>Same type, new sentences</small></div><span aria-hidden="true">→</span></button>
  <button class="back" data-act="home">← Home</button>`;
}
home();
</script>
{% endraw %}
