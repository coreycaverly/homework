---
title: Research Responses
layout: default
---

{% raw %}
<div id="app"></div>
<p class="quiz-nav"><a href="guide.html">Study guide</a> · <a href="../">All subjects</a></p>

<style>
/* Quiz UI, themed to sit inside the cayman page. Color = skill:
   Add the Details green, Own Words blue, Check It orange. */
#app{max-width:640px;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:20px}
#app *{box-sizing:border-box}
.quiz-nav{text-align:center;margin-top:28px}
:root{
  --bg:#F7F8FC; --card:#FFFFFF; --ink:#1A2042; --muted:#5B6386; --line:#DCE0EC; --hover:#EEF1F8;
  --detail:#15803D; --detail-soft:#DCFCE7; --own:#2563EB; --own-soft:#E1EAFC; --check:#C2410C; --check-soft:#FFE8D6;
  --hl:#FFE14D; --hl-ink:#1A2042; --miss:#D93A4A; --miss-soft:#FCE4E7; --good:#15803D;
}
#app, #app button{font-family:inherit}
#app p{margin:0}
#app button{color:inherit;cursor:pointer;border:0;background:none}
#app button:focus-visible{outline:3px solid var(--detail);outline-offset:2px}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .1em}
.intro{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.big-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;font-weight:600;font-size:1.15rem;transition:transform .12s}
.big-btn small{display:block;font-weight:400;font-size:.85rem;opacity:.8}
.big-btn:hover{transform:translateY(-2px)}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{border-radius:14px;padding:14px 10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic span{font-size:.72rem;font-weight:400}
.t-detail{background:var(--detail-soft);color:var(--detail)} .t-own{background:var(--own-soft);color:var(--own)} .t-check{background:var(--check-soft);color:var(--check)}
.c-detail{color:var(--detail)} .c-own{color:var(--own)} .c-check{color:var(--check)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{padding:8px 10px;border-radius:10px;color:var(--muted);font-size:.95rem}
.back:hover{background:var(--hover)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)} .dot.now{background:var(--ink)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.badge.mystery{background:var(--hover);color:var(--muted)}
.badge.t-detail{background:var(--detail-soft);color:var(--detail)} .badge.t-own{background:var(--own-soft);color:var(--own)} .badge.t-check{background:var(--check-soft);color:var(--check)}
.prompt{font-weight:600;font-size:1.2rem;line-height:1.35}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:1.02rem;background:var(--card);min-height:52px;text-align:left}
.choice:hover{border-color:var(--ink)}
.choice.t-detail{background:var(--detail-soft)} .choice.t-own{background:var(--own-soft)} .choice.t-check{background:var(--check-soft)}
.choice.oops{border-color:var(--miss);animation:shake .35s}
.hint{background:var(--hover);border-radius:12px;padding:12px 14px;font-size:.95rem}
.hint b{font-weight:600}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.result.detail{background:var(--detail-soft)} .result.own{background:var(--own-soft)} .result.check{background:var(--check-soft)}
.result strong{font-weight:800;font-size:1.2rem}
.answerline{font-weight:600}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600;font-size:1.1rem}
.stars{font-size:2.2rem;letter-spacing:4px;color:#E8B400}
.stars .off{color:var(--line)}
.pop{animation:pop .4s}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.center{align-items:center;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.topics{grid-template-columns:1fr}.topic{flex-direction:row;justify-content:space-between;padding:14px 16px}}
</style>

<script>
const BANK=[
 // ADD THE DETAILS — what / when / where / how it mattered; 3+ sentences
 {t:'detail',q:"A full event answer needs what, when, where, and one more thing. What?",a:"How it affected people or the world",o:["How long you spent on it","Who your teacher is","What font you used"],why:"What, when, where, AND how it mattered. That last one is the detail most people skip."},
 {t:'detail',q:"Which description is COMPLETE (what, when, where, and why it mattered)?",a:"In 1980, Mount St. Helens in Washington erupted and blasted ash for miles. The explosion flattened forests and killed 57 people. It changed how scientists warn communities about volcanoes.",o:["A volcano erupted.","Mount St. Helens erupted in 1980.","It was big and loud and scary and bad."],why:"The strong one covers what, when (1980), where (Washington), and how it mattered (changed volcano warnings). The others stop too soon."},
 {t:'detail',q:"The directions say “at least 3 complete sentences.” You wrote 1. Are you done?",a:"No — add at least 2 more sentences with real details",o:["Yes, one good sentence is enough","Yes, if that one sentence is long","No — delete it and start over"],why:"“At least 3” is a direction, not a suggestion. Add the where and the why it mattered until you reach 3 complete sentences."},
 {t:'detail',q:"Which sentence adds a WHERE detail?",a:"The first flight took off from a windy beach in Kitty Hawk, North Carolina.",o:["The flight was really important.","People were amazed by the flight.","It happened a long time ago."],why:"“Where” names the place: Kitty Hawk, North Carolina. The others give opinions, not a location."},
 {t:'detail',q:"A description that just repeats the title (“The dam was built.”) is missing…",a:"The details: when, where, and why it mattered",o:["Nothing — the title says it all","A capital letter","The author’s name"],why:"Restating the title is a start, not an answer. Add when, where, and the impact."},
 {t:'detail',q:"Which detail best answers “how did it affect the community?”",a:"After the bridge opened, families could reach the hospital in 10 minutes instead of an hour.",o:["The bridge was gray and very long.","The bridge opened on a Tuesday.","Lots of people liked the new bridge."],why:"Impact = what changed for people. Cutting a trip from an hour to 10 minutes is a real effect."},
 {t:'detail',q:"Trick — is this description already complete? “In 1969, the United States landed astronauts on the Moon for the first time. Millions watched on TV. It proved humans could travel beyond Earth.”",a:"Yes — what, when, where, and why it mattered are all there",o:["No — it needs the astronauts’ names","No — it is too short","No — it has no date"],why:"What (Moon landing), when (1969), where (U.S. mission/the Moon), and why it mattered (proved space travel) are all covered in 3 complete sentences. Don’t “fix” finished work."},
 // OWN WORDS — paraphrase vs copy-paste; citations
 {t:'own',q:"The directions say “do not copy and paste from the source.” What do you do instead?",a:"Read it, look away, then write the idea in your own words",o:["Paste it and put quotes around all of it","Paste it but change one word","Paste it and shrink the font"],why:"Own words means you understood it. Read, look away, and say it like you’d tell a friend."},
 {t:'own',q:"Which is written in your OWN words (not copied)?",a:"Scientists launched the telescope so they could see galaxies that are very far away.",o:["“The orbiting observatory was engineered to resolve distant celestial objects.”","The orbiting observatory was engineered to resolve distant celestial objects.","It was engineered to resolve distant celestial objects, the article said."],why:"The first sounds like you explaining it. The others are lifted straight from a source."},
 {t:'own',q:"Pasting a long quote straight from the website breaks which direction?",a:"“Write it in your own words — do not copy and paste”",o:["“Use at least 3 sentences”","“Add a title for each event”","“Include the month and year”"],why:"A pasted block quote is the source’s words, not yours. Paraphrase it instead."},
 {t:'own',q:"Every source you use needs a…",a:"Citation (and a spot on the Works Cited page)",o:["Photograph","Funny title","Highlighter color"],why:"A citation shows where the facts came from. List each source on the Works Cited page at the end."},
 {t:'own',q:"Best way to put this in your own words: “The eruption ejected volcanic ash into the stratosphere.”",a:"The volcano shot ash high into the sky.",o:["The eruption ejected ash into the stratosphere.","The eruption ejected volcanic ash high into the stratosphere.","Keep it exactly — it sounds smart."],why:"Say it the way you’d explain it out loud. Swapping or dropping one word still counts as copying."},
 {t:'own',q:"Trick — using AI to write the description for you is…",a:"Not allowed — the writing has to be yours",o:["Fine if you reword it after","Fine if no one checks","Required for the project"],why:"The assignment says the work must be your own. The point is to practice writing, not to skip it."},
 // CHECK IT — reread against the directions: fragments, run-ons, contradictions, placeholders
 {t:'check',q:"What is this? “Became the first person to reach the summit.”",a:"Fragment — no WHO is doing it",o:["A complete sentence","A run-on","A good topic sentence"],why:"It starts with “Became” but never says who. Add the who: “Tenzing Norgay became the first…”."},
 {t:'check',q:"Fix the run-on: “The treaty was signed in 1783 it ended the war.”",a:"The treaty was signed in 1783. It ended the war.",o:["The treaty was signed in 1783 it, ended the war.","The treaty was signed in 1783 it ended the war!","The treaty, was signed in 1783 it ended the war."],why:"Two complete ideas were squished together. Split with a period (or join with “, and”)."},
 {t:'check',q:"A sentence says a game ended in “a scoreless 1-0 win.” What’s wrong?",a:"It contradicts itself — 1-0 is not scoreless",o:["Nothing, it reads fine","It needs an exclamation point","“win” should be “won”"],why:"Scoreless means 0-0. Whisper-reading catches these — if it doesn’t make sense, fix it before you turn it in."},
 {t:'check',q:"You find “INSERT WORKS CITED HERE” still in your document. That means…",a:"You’re not finished — replace it before you submit",o:["It’s fine, the teacher adds that","Leave it, it’s a heading","Delete the whole Works Cited section"],why:"A placeholder you left in is a sign the work wasn’t reread. Finish it and check it before uploading."},
 {t:'check',q:"Capitalize correctly: the band name in “he toured with black sabbath.”",a:"Black Sabbath",o:["black sabbath","Black sabbath","BLACK SABBATH"],why:"Names of groups are proper nouns — capitalize each important word: Black Sabbath."},
 {t:'check',q:"Before you upload, the LAST thing to do is…",a:"Reread your work and check it against the directions",o:["Close the laptop quickly","Change the font","Add more emojis"],why:"STOP & CHECK: compare what you wrote to every direction — 3 sentences? all parts answered? sources cited? That’s the step that saves the points."}
];
const NAME={detail:"Add the Details",own:"Own Words",check:"Check It"};
const HINT={
 detail:"<b>Add the details:</b> a full answer is the title PLUS four details — what, when, where, and <b>how it mattered</b>. The one people skip is the last one. One sentence isn’t done; most prompts want at least 3 complete sentences.",
 own:"<b>Own words:</b> read the source, look away, then say it like you’d tell a friend. Pasting it — even changing one word — is still copying. Every source needs a citation on the Works Cited page. No AI.",
 check:"<b>Check it:</b> whisper-read. Every sentence needs a who + did what (no fragments, no run-ons), it has to make sense (no contradictions), names/places get capitals, and nothing is left unfinished (no placeholders)."
};
const RULE={
 detail:"A full event answer = What · When · Where · How it mattered, in at least 3 complete sentences. Don’t stop at the title.",
 own:"Read it, look away, say it in your own words. Pasting (even reworded) is copying. Cite every source on a Works Cited page. No AI.",
 check:"Whisper-read against the directions: no fragments, no run-ons, no contradictions, capitals on names/places, no leftover placeholders, and do every part of the prompt."
};

const app=document.getElementById('app');
let S=null;
const stats=load();
function load(){try{return JSON.parse(localStorage.getItem('hist-stats'))||{cases:0,stars:0}}catch(e){return{cases:0,stars:0}}}
function save(){try{localStorage.setItem('hist-stats',JSON.stringify(stats))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function home(){
  S=null;
  app.innerHTML=`
  <p class="intro muted">Turn a fact into a full answer. Check the directions. Short rounds — about 3 minutes.</p>
  <button class="big-btn" data-act="start" data-mode="mix">
    <div>Quick round<small>5 questions · all three skills · about 3 minutes</small></div><span aria-hidden="true">→</span>
  </button>
  <div class="card">
    <span class="label">Practice one skill (6 questions)</span>
    <div class="topics">
      <button class="topic t-detail" data-act="start" data-mode="detail">Add the Details<span>what · when · where · why</span></button>
      <button class="topic t-own" data-act="start" data-mode="own">Own Words<span>paraphrase · cite</span></button>
      <button class="topic t-check" data-act="start" data-mode="check">Check It<span>reread · fix · finish</span></button>
    </div>
  </div>
  <div class="card">
    <span class="label">How it works</span>
    <ol class="steps">
      <li><span><b>Read</b> the question and <b>pick</b> the answer.</span></li>
      <li><span>Every answer gives you the <b>why</b> — the rule to remember.</span></li>
      <li><span>In a quick round, <b>name the skill</b> for a bonus star.</span></li>
    </ol>
    <div class="stats muted"><span>Rounds done: <b>${stats.cases}</b></span><span>Stars earned: <b>${stats.stars}</b> ★</span></div>
  </div>`;
}

function start(mode){
  const pool=mode==='mix'?BANK:BANK.filter(q=>q.t===mode);
  const n=mode==='mix'?5:6;
  S={mode,qs:shuffle(pool).slice(0,n),i:0,stars:0,max:0,missed:new Set()};
  setupQ();
}
function setupQ(){
  const q=S.qs[S.i];
  Object.assign(S,{phase:'answer',miss:0,typeMiss:0,msg:'',opts:shuffle([q.a,...q.o]),pts:0,oops:null});
  S.max+=S.mode==='mix'?2:1;
  render();
}
function render(){
  const q=S.qs[S.i], mix=S.mode==='mix', ph=S.phase;
  const dots=S.qs.map((_,k)=>`<span class="dot ${k<S.i?'done':k===S.i?'now':''}"></span>`).join('');
  let body='';
  if(ph==='answer'){
    body=`<p class="prompt">${esc(q.q)}</p>
    <div class="choices">${S.opts.map((o,k)=>`<button class="choice ${S.oops==='o'+k?'oops':''}" data-act="answer" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  }else if(ph==='type'){
    body=`<p class="prompt">Bonus star: what skill was that question?</p>
    <div class="choices">${['detail','own','check'].map(t=>`<button class="choice t-${t} ${S.oops==='t'+t?'oops':''}" data-act="type" data-t="${t}">${NAME[t]}</button>`).join('')}</div>`;
  }else{
    const of=mix?2:1;
    body=`<p class="prompt">${esc(q.q)}</p>
    <p class="answerline c-${q.t}">✓ ${esc(q.a)}</p>
    <div class="result ${q.t}"><strong class="pop">${S.pts===of?'Perfect!':S.pts>0?'Nice!':'Got it.'} ${'★'.repeat(S.pts)}</strong><p>${esc(q.why)}</p></div>
    <button class="next" data-act="next">${S.i<S.qs.length-1?'Next question →':'See my results →'}</button>`;
  }
  const badge=(!mix||ph==='done')?`<span class="badge t-${q.t}">${NAME[q.t]}</span>`:`<span class="badge mystery">Mixed</span>`;
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="home">← Home</button><div class="dots" role="img" aria-label="Question ${S.i+1} of ${S.qs.length}">${dots}</div><span class="score">★ ${S.stars}</span></div>
  <section class="card">${badge}${body}${S.msg?`<div class="hint" role="status">${S.msg}</div>`:''}</section>`;
  S.oops=null;
}
function missHint(q){
  S.miss++;
  if(S.miss===1)S.msg="Not quite — read it again slowly, out loud in a whisper.";
  else S.msg=HINT[q.t];
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='home')return home();
  if(a==='start')return start(b.dataset.mode);
  const q=S&&S.qs[S.i]; if(!q)return;
  if(a==='answer'&&S.phase==='answer'){
    const o=S.opts[+b.dataset.k];
    if(o===q.a){ if(S.miss===0)S.pts++; else S.missed.add(q.t); S.msg=''; S.phase=S.mode==='mix'?'type':'done'; }
    else{ S.oops='o'+b.dataset.k; missHint(q); }
    return render();
  }
  if(a==='type'&&S.phase==='type'){
    if(b.dataset.t===q.t){ if(S.typeMiss===0)S.pts++; S.msg=''; S.phase='done'; }
    else{ S.oops='t'+b.dataset.t; S.typeMiss++; S.msg="Look again. Is it about adding details (Add the Details), writing it yourself (Own Words), or rereading and fixing (Check It)?"; }
    return render();
  }
  if(a==='next'){
    S.stars+=S.pts;
    if(S.i<S.qs.length-1){S.i++;return setupQ()}
    return finish();
  }
});
function finish(){
  stats.cases++; stats.stars+=S.stars; save();
  try{localStorage.setItem('hw-done-history',new Date().toISOString().slice(0,10))}catch(e){}
  const pct=S.max?S.stars/S.max:0, on=Math.min(5,Math.round(pct*5));
  const head=pct>=.9?"Amazing!":pct>=.6?"Nice work!":"Good work sticking with it!";
  const rules=[...S.missed].map(t=>`<li><b class="c-${t}">${NAME[t]}:</b> ${RULE[t]}</li>`).join('');
  app.innerHTML=`
  <section class="card center">
    <span class="label">Results</span>
    <h2>${head}</h2>
    <div class="stars pop" aria-hidden="true">${'★'.repeat(on)}<span class="off">${'★'.repeat(5-on)}</span></div>
    <p><b>${S.stars}</b> of ${S.max} stars</p>
  </section>
  ${rules?`<section class="card"><span class="label">Rules to remember</span><ul class="rules">${rules}</ul></section>`:''}
  <button class="big-btn" data-act="start" data-mode="${S.mode}"><div>Another round<small>Same skill, new questions</small></div><span aria-hidden="true">→</span></button>
  <button class="back" data-act="home">← Home</button>`;
}
home();
</script>
{% endraw %}
