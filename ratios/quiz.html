---
title: Ratios, Rates & Percentages
layout: default
---

{% raw %}
<div id="app"></div>
<p class="quiz-nav"><a href="guide.html">Study guide</a> · <a href="../">All subjects</a></p>

<style>
/* Quiz UI, themed to sit inside the cayman page. Color = topic:
   Ratios indigo, Rates cyan, Unit rate amber. */
#app{max-width:640px;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:20px}
#app *{box-sizing:border-box}
.quiz-nav{text-align:center;margin-top:28px}
:root{
  --bg:#F7F8FC; --card:#FFFFFF; --ink:#1A2042; --muted:#5B6386; --line:#DCE0EC; --hover:#EEF1F8;
  --ratio:#4F46E5; --ratio-soft:#E6E6FB; --rate:#0E7490; --rate-soft:#D7EEF4; --unit:#B45309; --unit-soft:#FBEAD2;
  --explain:#BE185D; --explain-soft:#FBE0EC; --hl:#FFE14D; --hl-ink:#1A2042; --miss:#D93A4A; --miss-soft:#FCE4E7; --good:#4F46E5;
}
#app, #app button{font-family:inherit}
#app p{margin:0}
#app button{color:inherit;cursor:pointer;border:0;background:none}
#app button:focus-visible{outline:3px solid var(--ratio);outline-offset:2px}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .1em}
.intro{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.big-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;font-weight:600;font-size:1.15rem;transition:transform .12s}
.big-btn small{display:block;font-weight:400;font-size:.85rem;opacity:.8}
.big-btn:hover{transform:translateY(-2px)}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.topic{border-radius:14px;padding:14px 10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic span{font-size:.72rem;font-weight:400}
.t-ratio{background:var(--ratio-soft);color:var(--ratio)} .t-rate{background:var(--rate-soft);color:var(--rate)} .t-unit{background:var(--unit-soft);color:var(--unit)} .t-explain{background:var(--explain-soft);color:var(--explain)}
.c-ratio{color:var(--ratio)} .c-rate{color:var(--rate)} .c-unit{color:var(--unit)} .c-explain{color:var(--explain)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{padding:8px 10px;border-radius:10px;color:var(--muted);font-size:.95rem}
.back:hover{background:var(--hover)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)} .dot.now{background:var(--ink)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.badge.mystery{background:var(--hover);color:var(--muted)}
.badge.t-ratio{background:var(--ratio-soft);color:var(--ratio)} .badge.t-rate{background:var(--rate-soft);color:var(--rate)} .badge.t-unit{background:var(--unit-soft);color:var(--unit)} .badge.t-explain{background:var(--explain-soft);color:var(--explain)}
.prompt{font-weight:600;font-size:1.2rem;line-height:1.35}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice{border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:1.05rem;background:var(--card);min-height:52px;text-align:left}
.choice:hover{border-color:var(--ink)}
.choice.t-ratio{background:var(--ratio-soft)} .choice.t-rate{background:var(--rate-soft)} .choice.t-unit{background:var(--unit-soft)} .choice.t-explain{background:var(--explain-soft)}
.choice.oops{border-color:var(--miss);animation:shake .35s}
.hint{background:var(--hover);border-radius:12px;padding:12px 14px;font-size:.95rem}
.hint b{font-weight:600}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.result.ratio{background:var(--ratio-soft)} .result.rate{background:var(--rate-soft)} .result.unit{background:var(--unit-soft)} .result.explain{background:var(--explain-soft)}
.result strong{font-weight:800;font-size:1.2rem}
.answerline{font-weight:600}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600;font-size:1.1rem}
.stars{font-size:2.2rem;letter-spacing:4px;color:#E8B400}
.stars .off{color:var(--line)}
.pop{animation:pop .4s}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.center{align-items:center;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.topics{grid-template-columns:1fr}.topic{flex-direction:row;justify-content:space-between;padding:14px 16px}}
</style>

<script>
const BANK=[
 // RATIOS
 {t:'ratio',q:"A paint mix is 3 cups red to 2 cups yellow. What is the ratio of yellow to red?",a:"2 : 3",o:["3 : 2","2 : 5","5 : 2"],why:"Yellow to red lists yellow first: 2 : 3. Order matters in a ratio."},
 {t:'ratio',q:"Which ratio is equivalent to 2 : 3?",a:"6 : 9",o:["2 : 6","3 : 2","5 : 6"],why:"Multiply both parts by the same number: 2×3 : 3×3 = 6 : 9."},
 {t:'ratio',q:"Cats to dogs is 4 : 5, and there are 27 animals. If each part equals 3 animals, how many dogs?",a:"15",o:["12","9","27"],why:"Dogs = 5 parts × 3 = 15. (Cats = 4 × 3 = 12, and 12 + 15 = 27.)"},
 {t:'ratio',q:"A recipe uses 2 cups of flour for every 1 cup of sugar. For 6 cups of flour, how much sugar?",a:"3 cups",o:["4 cups","12 cups","2 cups"],why:"6 ÷ 2 = 3 groups, so 3 × 1 = 3 cups of sugar. The ratio stays 2 : 1."},
 {t:'ratio',q:"There are 4 sunny days for every rainy day. In 30 days, how many are rainy?",a:"6",o:["4","24","5"],why:"Each group is 4 sunny + 1 rainy = 5 days. 30 ÷ 5 = 6 rainy days."},
 // RATES
 {t:'rate',q:"Noah rides 32 miles in 160 minutes. How many minutes for 1 mile?",a:"5 minutes",o:["32 minutes","160 minutes","0.2 minutes"],why:"Divide to get the rate for one: 160 ÷ 32 = 5 minutes per mile."},
 {t:'rate',q:"At 5 minutes per mile, how long to ride 100 miles?",a:"500 minutes",o:["105 minutes","20 minutes","50 minutes"],why:"100 miles × 5 minutes = 500 minutes."},
 {t:'rate',q:"A cashier earns $58 in 8 hours. How much per hour?",a:"$7.25",o:["$8.00","$50.00","$66.00"],why:"Divide: $58 ÷ 8 = $7.25 per hour (the unit rate)."},
 {t:'rate',q:"At $7.25 per hour, how much for 3 hours?",a:"$21.75",o:["$7.25","$10.25","$24.17"],why:"3 × $7.25 = $21.75."},
 {t:'rate',q:"A car goes 20 miles in half an hour. What is its speed in miles per hour?",a:"40 mph",o:["20 mph","10 mph","80 mph"],why:"In a full hour it goes twice as far: 2 × 20 = 40 miles per hour."},
 {t:'rate',q:"Each penny weighs 2.5 grams. How many pennies weigh 2,400 grams?",a:"960",o:["6,000","240","2,400"],why:"2,400 ÷ 2.5 = 960 pennies (which is $9.60)."},
 // UNIT RATE / UNIT PRICE
 {t:'unit',q:"A 3-pound bag of oranges costs $6. What is the price per pound?",a:"$2",o:["$3","$6","$18"],why:"Price per pound = total ÷ pounds = $6 ÷ 3 = $2 per pound."},
 {t:'unit',q:"Bag A: 3 lb for $6. Bag B: 5 lb for $8. Which is the better deal?",a:"Bag B — it's cheaper per pound",o:["Bag A","They cost the same","Bag A, because it's smaller"],why:"Per pound: $6÷3 = $2.00 vs $8÷5 = $1.60. The lower price per pound (Bag B) is the better deal."},
 {t:'unit',q:"Which is cheaper per pound: 2 lb for $5, or 4 lb for $8?",a:"4 lb for $8",o:["2 lb for $5","They're equal","Can't tell"],why:"$5÷2 = $2.50 per pound vs $8÷4 = $2.00 per pound. The 4-lb bag is cheaper per pound."},
 {t:'unit',q:"A store sells 6 apples for $3. What is the price for one apple?",a:"$0.50",o:["$2","$3","$6"],why:"$3 ÷ 6 = $0.50 per apple (the unit price)."},
 {t:'unit',q:"Mai uses 10 oz of cheese for 4 pizzas. How much cheese per pizza?",a:"2.5 oz",o:["10 oz","40 oz","4 oz"],why:"10 ÷ 4 = 2.5 oz of cheese per pizza (the unit rate)."},
 {t:'unit',q:"At 2.5 oz of cheese per pizza, how much for 15 pizzas?",a:"37.5 oz",o:["17.5 oz","6 oz","25 oz"],why:"15 × 2.5 = 37.5 oz."}
];
const NAME={ratio:"Ratios",rate:"Rates",unit:"Unit Rate"};
const HINT={
 ratio:"<b>Ratios:</b> a ratio compares two amounts, and order matters (yellow : red). To make an equivalent ratio, multiply or divide BOTH parts by the same number.",
 rate:"<b>Rates:</b> a rate is an amount 'per' something. Divide to find the rate for ONE (per mile, per hour), then multiply up.",
 unit:"<b>Unit rate / price:</b> divide the total by the amount to get the cost (or amount) for ONE. For 'better deal', the LOWER price per pound wins."
};
const RULE={
 ratio:"A ratio compares two amounts in order. Make equivalent ratios by multiplying or dividing both parts by the same number.",
 rate:"A rate is 'per' something. Divide to get the amount for ONE, then multiply up to any amount.",
 unit:"Unit rate = total ÷ amount, giving the value for ONE. Cheaper per unit = better deal (lower number wins)."
};

/* + Explain It (ACE) topic — added by homework-intake */
NAME.explain="Explain It";
HINT.explain="<b>Explain It (ACE):</b> Answer in a full sentence that restates the question, show it with labels and units, and explain WHY with the rule or formula. Never start with ‘Because’ or hand in a bare number.";
RULE.explain="ACE: Answer (restate the question) · show it with labels & units · Explain why. Start by restating; never start with ‘Because’.";
BANK.push(
 {t:'explain',q:"Which answer is STRONGER? Q: is 6:8 equivalent to 3:4?",a:"Yes. 6:8 is equivalent to 3:4, because dividing both 6 and 8 by 2 gives 3 and 4.",o:["Yes.", "Yes, divide.", "6:8 = 3:4."],why:"ACE: restate + answer, show the ÷2 step, and explain why it stays equal."},
 {t:'explain',q:"Which answer uses LABELS, not a bare number? Q: 3 juice boxes cost $3.60 — price per box?",a:"Each juice box costs $1.20, because $3.60 ÷ 3 = $1.20 per box.",o:["1.2.", "$3.60 ÷ 3.", "It's 1.20."],why:"Say the units — dollars per box — so the number means something."},
 {t:'explain',q:"Jordan says 4 tacos cost $10, so 6 cost $12 (he added 2). Real cost + why?",a:"$15, because each taco is $10 ÷ 4 = $2.50, so 6 × $2.50 = $15.",o:["$12 — add 2 since 6 is 2 more.", "$15.", "$13.50."],why:"Ratios multiply, not add. Unit rate $2.50 × 6 = $15 — and show that work."},
 {t:'explain',q:"A strong answer to a rate problem STARTS by…",a:"Restating the question in a complete sentence",o:["Writing “Because…”", "Giving just the number", "Listing the steps only"],why:"Say ‘The unit rate is…’ first. Never open with ‘Because’ or a lone number."}
);
const app=document.getElementById('app');
let S=null;
const stats=load();
function load(){try{return JSON.parse(localStorage.getItem('md-stats'))||{cases:0,stars:0}}catch(e){return{cases:0,stars:0}}}
function save(){try{localStorage.setItem('md-stats',JSON.stringify(stats))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function home(){
  S=null;
  app.innerHTML=`
  <p class="intro muted">Read the problem, pick the answer, and learn the why. Short rounds — about 3 minutes.</p>
  <button class="big-btn" data-act="start" data-mode="mix">
    <div>Quick round<small>5 problems · all four topics · about 3 minutes</small></div><span aria-hidden="true">→</span>
  </button>
  <div class="card">
    <span class="label">Practice one topic (6 problems)</span>
    <div class="topics">
      <button class="topic t-ratio" data-act="start" data-mode="ratio">Ratios<span>a : b, equivalent</span></button>
      <button class="topic t-rate" data-act="start" data-mode="rate">Rates<span>per hour · per mile</span></button>
      <button class="topic t-unit" data-act="start" data-mode="unit">Unit Rate<span>price per one</span></button>
      <button class="topic t-explain" data-act="start" data-mode="explain">Explain It<span>ACE · say the why</span></button>
    </div>
  </div>
  <div class="card">
    <span class="label">How it works</span>
    <ol class="steps">
      <li><span><b>Read</b> the problem and <b>pick</b> the answer.</span></li>
      <li><span>Every answer shows the <b>why</b> — the step that gets there.</span></li>
      <li><span>In a quick round, <b>name the topic</b> for a bonus star.</span></li>
    </ol>
    <div class="stats muted"><span>Rounds done: <b>${stats.cases}</b></span><span>Stars earned: <b>${stats.stars}</b> ★</span></div>
  </div>`;
}

function start(mode){
  const pool=mode==='mix'?BANK:BANK.filter(q=>q.t===mode);
  const n=mode==='mix'?5:6;
  S={mode,qs:shuffle(pool).slice(0,n),i:0,stars:0,max:0,missed:new Set()};
  setupQ();
}
function setupQ(){
  const q=S.qs[S.i];
  Object.assign(S,{phase:'answer',miss:0,typeMiss:0,msg:'',opts:shuffle([q.a,...q.o]),pts:0,oops:null});
  S.max+=S.mode==='mix'?2:1;
  render();
}
function render(){
  const q=S.qs[S.i], mix=S.mode==='mix', ph=S.phase;
  const dots=S.qs.map((_,k)=>`<span class="dot ${k<S.i?'done':k===S.i?'now':''}"></span>`).join('');
  let body='';
  if(ph==='answer'){
    body=`<p class="prompt">${esc(q.q)}</p>
    <div class="choices">${S.opts.map((o,k)=>`<button class="choice ${S.oops==='o'+k?'oops':''}" data-act="answer" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  }else if(ph==='type'){
    body=`<p class="prompt">Bonus star: what topic was that problem?</p>
    <div class="choices">${['ratio','rate','unit','explain'].map(t=>`<button class="choice t-${t} ${S.oops==='t'+t?'oops':''}" data-act="type" data-t="${t}">${NAME[t]}</button>`).join('')}</div>`;
  }else{
    const of=mix?2:1;
    body=`<p class="prompt">${esc(q.q)}</p>
    <p class="answerline c-${q.t}">✓ ${esc(q.a)}</p>
    <div class="result ${q.t}"><strong class="pop">${S.pts===of?'Perfect!':S.pts>0?'Nice!':'Got it.'} ${'★'.repeat(S.pts)}</strong><p>${esc(q.why)}</p></div>
    <button class="next" data-act="next">${S.i<S.qs.length-1?'Next problem →':'See my results →'}</button>`;
  }
  const badge=(!mix||ph==='done')?`<span class="badge t-${q.t}">${NAME[q.t]}</span>`:`<span class="badge mystery">Mixed</span>`;
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="home">← Home</button><div class="dots" role="img" aria-label="Problem ${S.i+1} of ${S.qs.length}">${dots}</div><span class="score">★ ${S.stars}</span></div>
  <section class="card">${badge}${body}${S.msg?`<div class="hint" role="status">${S.msg}</div>`:''}</section>`;
  S.oops=null;
}
function missHint(q){
  S.miss++;
  if(S.miss===1)S.msg="Not quite — read it again slowly. What is the problem really asking?";
  else S.msg=HINT[q.t];
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='home')return home();
  if(a==='start')return start(b.dataset.mode);
  const q=S&&S.qs[S.i]; if(!q)return;
  if(a==='answer'&&S.phase==='answer'){
    const o=S.opts[+b.dataset.k];
    if(o===q.a){ if(S.miss===0)S.pts++; else S.missed.add(q.t); S.msg=''; S.phase=S.mode==='mix'?'type':'done'; }
    else{ S.oops='o'+b.dataset.k; missHint(q); }
    return render();
  }
  if(a==='type'&&S.phase==='type'){
    if(b.dataset.t===q.t){ if(S.typeMiss===0)S.pts++; S.msg=''; S.phase='done'; }
    else{ S.oops='t'+b.dataset.t; S.typeMiss++; S.msg="Look again. Is it comparing two amounts (Ratio), an amount 'per' something (Rate), or the price for ONE (Unit Rate), or explaining the why in a sentence (Explain It)?"; }
    return render();
  }
  if(a==='next'){
    S.stars+=S.pts;
    if(S.i<S.qs.length-1){S.i++;return setupQ()}
    return finish();
  }
});
function finish(){
  stats.cases++; stats.stars+=S.stars; save();
  try{localStorage.setItem('hw-done-ratios',new Date().toISOString().slice(0,10))}catch(e){}
  const pct=S.max?S.stars/S.max:0, on=Math.min(5,Math.round(pct*5));
  const head=pct>=.9?"Amazing!":pct>=.6?"Nice work!":"Good work sticking with it!";
  const rules=[...S.missed].map(t=>`<li><b class="c-${t}">${NAME[t]}:</b> ${RULE[t]}</li>`).join('');
  app.innerHTML=`
  <section class="card center">
    <span class="label">Results</span>
    <h2>${head}</h2>
    <div class="stars pop" aria-hidden="true">${'★'.repeat(on)}<span class="off">${'★'.repeat(5-on)}</span></div>
    <p><b>${S.stars}</b> of ${S.max} stars</p>
  </section>
  ${rules?`<section class="card"><span class="label">Rules to remember</span><ul class="rules">${rules}</ul></section>`:''}
  <button class="big-btn" data-act="start" data-mode="${S.mode}"><div>Another round<small>Same topic, new problems</small></div><span aria-hidden="true">→</span></button>
  <button class="back" data-act="home">← Home</button>`;
}
home();
</script>
{% endraw %}
