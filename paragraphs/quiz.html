---
title: Paragraph Writing
layout: default
---

{% raw %}
<div id="app"></div>
<p class="quiz-nav"><a href="guide.html">Study guide</a> · <a href="../english/">All English lessons</a></p>

<style>
/* Quiz UI, themed to sit inside the cayman page. Color = skill:
   Topic Sentence blue, Elaborate green, Connect & Conclude rose. */
#app{max-width:640px;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:20px}
#app *{box-sizing:border-box}
.quiz-nav{text-align:center;margin-top:28px}
:root{
  --bg:#F7F8FC; --card:#FFFFFF; --ink:#1A2042; --muted:#5B6386; --line:#DCE0EC; --hover:#EEF1F8;
  --topic:#2563EB; --topic-soft:#E1EAFC; --elab:#15803D; --elab-soft:#DCFCE7; --connect:#BE185D; --connect-soft:#FBE0EC;
  --hl:#FFE14D; --hl-ink:#1A2042; --miss:#D93A4A; --miss-soft:#FCE4E7; --good:#15803D;
}
#app, #app button{font-family:inherit}
#app p{margin:0}
#app button{color:inherit;cursor:pointer;border:0;background:none}
#app button:focus-visible{outline:3px solid var(--topic);outline-offset:2px}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .1em}
.intro{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.big-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;font-weight:600;font-size:1.15rem;transition:transform .12s}
.big-btn small{display:block;font-weight:400;font-size:.85rem;opacity:.8}
.big-btn:hover{transform:translateY(-2px)}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{border-radius:14px;padding:14px 10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic span{font-size:.72rem;font-weight:400}
.t-topic{background:var(--topic-soft);color:var(--topic)} .t-elab{background:var(--elab-soft);color:var(--elab)} .t-connect{background:var(--connect-soft);color:var(--connect)}
.c-topic{color:var(--topic)} .c-elab{color:var(--elab)} .c-connect{color:var(--connect)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{padding:8px 10px;border-radius:10px;color:var(--muted);font-size:.95rem}
.back:hover{background:var(--hover)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)} .dot.now{background:var(--ink)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.badge.mystery{background:var(--hover);color:var(--muted)}
.badge.t-topic{background:var(--topic-soft);color:var(--topic)} .badge.t-elab{background:var(--elab-soft);color:var(--elab)} .badge.t-connect{background:var(--connect-soft);color:var(--connect)}
.prompt{font-weight:600;font-size:1.2rem;line-height:1.35}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:1.02rem;background:var(--card);min-height:52px;text-align:left}
.choice:hover{border-color:var(--ink)}
.choice.t-topic{background:var(--topic-soft)} .choice.t-elab{background:var(--elab-soft)} .choice.t-connect{background:var(--connect-soft)}
.choice.oops{border-color:var(--miss);animation:shake .35s}
.hint{background:var(--hover);border-radius:12px;padding:12px 14px;font-size:.95rem}
.hint b{font-weight:600}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.result.topic{background:var(--topic-soft)} .result.elab{background:var(--elab-soft)} .result.connect{background:var(--connect-soft)}
.result strong{font-weight:800;font-size:1.2rem}
.answerline{font-weight:600}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600;font-size:1.1rem}
.stars{font-size:2.2rem;letter-spacing:4px;color:#E8B400}
.stars .off{color:var(--line)}
.pop{animation:pop .4s}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.center{align-items:center;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.topics{grid-template-columns:1fr}.topic{flex-direction:row;justify-content:space-between;padding:14px 16px}}
</style>

<script>
const BANK=[
 // TOPIC SENTENCE — restate the question
 {t:'topic',q:"A topic sentence should…",a:"Restate the question in a complete sentence",o:["Start with “Because…”","Give a bare one-word answer","Ask the question back"],why:"Turn the prompt into a statement: 'Recess is important for three reasons.'"},
 {t:'topic',q:"Q: “Why is recess important?” Best topic sentence?",a:"Recess is important for three reasons.",o:["Because it's fun.","Recess.","Is recess important?"],why:"It restates the question as a full sentence. 'Because it's fun' is a fragment; 'Recess' is one word."},
 {t:'topic',q:"Which restates the prompt “How did the printing press change the world?”",a:"The printing press changed the world in several big ways.",o:["The printing press.","Because of books.","It was invented long ago."],why:"A topic sentence turns the question into a statement you'll go on to prove."},
 {t:'topic',q:"A topic sentence that just says “Yes.” is missing…",a:"The restated question in a complete sentence",o:["A question mark","An exclamation point","Nothing — 'Yes' is fine"],why:"Restate first: 'Yes, dogs make good pets because…' — never answer with a bare word."},
 {t:'topic',q:"Trick — is this a strong topic sentence? “There are three reasons exercise is good for you.”",a:"Yes — it restates the idea and sets up the evidence",o:["No, it should start with 'Because'","No, it needs a number word","No, it's a fragment"],why:"It's a complete sentence that previews three reasons. Strong topic sentence."},
 // ELABORATE — the "so what?"
 {t:'elab',q:"After you give a piece of evidence, elaboration answers…",a:"“So what? Why does it matter?”",o:["“What's for lunch?”","“How long is the paragraph?”","“Who is the teacher?”"],why:"Elaboration explains why the evidence matters — the 'so what'."},
 {t:'elab',q:"Which sentence ELABORATES? Evidence: “Dogs can smell very well.”",a:"This matters because dogs can track a missing person by scent.",o:["Dogs have noses.","Dogs are animals.","Dogs can smell very well."],why:"It explains WHY the smelling matters. The others repeat it or add nothing."},
 {t:'elab',q:"Which is the STRONGER sentence?",a:"The sun gives light, which plants use to grow our food.",o:["The sun gives light.","The sun is bright.","The sun is in the sky."],why:"It adds the 'so what' — what the light does. The others just state a fact."},
 {t:'elab',q:"Which is NOT elaboration?",a:"In my opinion, dogs are cute.",o:["This matters because dogs help people feel calm.","As a result, more families adopt them.","This shows that dogs are loyal."],why:"Elaboration explains the WHY with a reason — not just how you feel."},
 {t:'elab',q:"Evidence with no elaboration is like…",a:"A fact with no “so what” — add why it matters",o:["A complete paragraph","Too much information","A perfect answer"],why:"State the reason, then explain why it matters. That's the part worth the points."},
 {t:'elab',q:"Trick — does this already elaborate? “The bridge cut the trip in half, so families reach the hospital faster.”",a:"Yes — it states the fact AND explains why it matters",o:["No, it needs another fact","No, it's an opinion","No, it's a fragment"],why:"'so families reach the hospital faster' is the 'so what'. Already elaborated."},
 // CONNECT & CONCLUDE — transitions + conclusion
 {t:'connect',q:"Which word signals your FIRST piece of evidence?",a:"First,",o:["Finally,","In conclusion,","Because"],why:"'First,' opens the first reason. 'Finally' and 'In conclusion' come at the end."},
 {t:'connect',q:"Which transition starts a CONCLUSION?",a:"In conclusion,",o:["First,","For example,","Next,"],why:"'In conclusion,' (or 'All in all,') signals you're wrapping up."},
 {t:'connect',q:"Between your 2nd and 3rd evidence, a good transition is…",a:"Next, / Another reason…",o:["The end.","First of all,","In conclusion,"],why:"Use a 'next' transition to connect the middle points."},
 {t:'connect',q:"A conclusion should…",a:"Restate the main idea, after a final transition",o:["Add a brand-new reason","Ask a new question","Start a different topic"],why:"Wrap up what you proved — don't introduce new evidence in the conclusion."},
 {t:'connect',q:"Trick — “First… Next… Finally…” in a paragraph are…",a:"Transition words that connect your evidence",o:["Spelling mistakes","Topic sentences","Conclusions"],why:"First/Next/Finally are sequence transitions that link your points in order."}
];
const NAME={topic:"Topic Sentence",elab:"Elaborate",connect:"Connect & Conclude"};
const HINT={
 topic:"<b>Topic sentence:</b> restate the question as a complete statement that previews your reasons. Never start with 'Because' or a bare one-word answer.",
 elab:"<b>Elaborate:</b> after each piece of evidence, explain the 'so what' — why it matters. Use 'This matters because… / This shows… / As a result…'. An opinion isn't elaboration.",
 connect:"<b>Connect & conclude:</b> start each new piece of evidence with a transition (First, Next, Finally). End with a final transition (In conclusion) and restate the main idea — no new reasons."
};
const RULE={
 topic:"Topic sentence = restate the question in a complete sentence. Never open with 'Because' or one word.",
 elab:"After evidence, add the 'so what' — explain why it matters (This matters because…/As a result…). Opinion is not elaboration.",
 connect:"Transition before each new point (First/Next/Finally). Conclusion: final transition + restate the main idea, no new reasons."
};

const app=document.getElementById('app');
let S=null;
const stats=load();
function load(){try{return JSON.parse(localStorage.getItem('pgraph-stats'))||{cases:0,stars:0}}catch(e){return{cases:0,stars:0}}}
function save(){try{localStorage.setItem('pgraph-stats',JSON.stringify(stats))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function home(){
  S=null;
  app.innerHTML=`
  <p class="intro muted">Topic sentence, evidence you explain, transitions, a conclusion. Short rounds — about 3 minutes.</p>
  <button class="big-btn" data-act="start" data-mode="mix">
    <div>Quick round<small>5 questions · all three skills · about 3 minutes</small></div><span aria-hidden="true">→</span>
  </button>
  <div class="card">
    <span class="label">Practice one skill (5–6 questions)</span>
    <div class="topics">
      <button class="topic t-topic" data-act="start" data-mode="topic">Topic Sentence<span>restate the question</span></button>
      <button class="topic t-elab" data-act="start" data-mode="elab">Elaborate<span>the "so what?"</span></button>
      <button class="topic t-connect" data-act="start" data-mode="connect">Connect &amp; Conclude<span>transitions</span></button>
    </div>
  </div>
  <div class="card">
    <span class="label">How it works</span>
    <ol class="steps">
      <li><span><b>Read</b> the question and <b>pick</b> the answer.</span></li>
      <li><span>Every answer gives you the <b>why</b> — the rule to remember.</span></li>
      <li><span>In a quick round, <b>name the skill</b> for a bonus star.</span></li>
    </ol>
    <div class="stats muted"><span>Rounds done: <b>${stats.cases}</b></span><span>Stars earned: <b>${stats.stars}</b> ★</span></div>
  </div>`;
}

function start(mode){
  const pool=mode==='mix'?BANK:BANK.filter(q=>q.t===mode);
  const n=mode==='mix'?5:6;
  S={mode,qs:shuffle(pool).slice(0,n),i:0,stars:0,max:0,missed:new Set()};
  setupQ();
}
function setupQ(){
  const q=S.qs[S.i];
  Object.assign(S,{phase:'answer',miss:0,typeMiss:0,msg:'',opts:shuffle([q.a,...q.o]),pts:0,oops:null});
  S.max+=S.mode==='mix'?2:1;
  render();
}
function render(){
  const q=S.qs[S.i], mix=S.mode==='mix', ph=S.phase;
  const dots=S.qs.map((_,k)=>`<span class="dot ${k<S.i?'done':k===S.i?'now':''}"></span>`).join('');
  let body='';
  if(ph==='answer'){
    body=`<p class="prompt">${esc(q.q)}</p>
    <div class="choices">${S.opts.map((o,k)=>`<button class="choice ${S.oops==='o'+k?'oops':''}" data-act="answer" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  }else if(ph==='type'){
    body=`<p class="prompt">Bonus star: what skill was that question?</p>
    <div class="choices">${['topic','elab','connect'].map(t=>`<button class="choice t-${t} ${S.oops==='t'+t?'oops':''}" data-act="type" data-t="${t}">${NAME[t]}</button>`).join('')}</div>`;
  }else{
    const of=mix?2:1;
    body=`<p class="prompt">${esc(q.q)}</p>
    <p class="answerline c-${q.t}">✓ ${esc(q.a)}</p>
    <div class="result ${q.t}"><strong class="pop">${S.pts===of?'Perfect!':S.pts>0?'Nice!':'Got it.'} ${'★'.repeat(S.pts)}</strong><p>${esc(q.why)}</p></div>
    <button class="next" data-act="next">${S.i<S.qs.length-1?'Next question →':'See my results →'}</button>`;
  }
  const badge=(!mix||ph==='done')?`<span class="badge t-${q.t}">${NAME[q.t]}</span>`:`<span class="badge mystery">Mixed</span>`;
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="home">← Home</button><div class="dots" role="img" aria-label="Question ${S.i+1} of ${S.qs.length}">${dots}</div><span class="score">★ ${S.stars}</span></div>
  <section class="card">${badge}${body}${S.msg?`<div class="hint" role="status">${S.msg}</div>`:''}</section>`;
  S.oops=null;
}
function missHint(q){
  S.miss++;
  if(S.miss===1)S.msg="Not quite — read it again slowly, out loud in a whisper.";
  else S.msg=HINT[q.t];
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='home')return home();
  if(a==='start')return start(b.dataset.mode);
  const q=S&&S.qs[S.i]; if(!q)return;
  if(a==='answer'&&S.phase==='answer'){
    const o=S.opts[+b.dataset.k];
    if(o===q.a){ if(S.miss===0)S.pts++; else S.missed.add(q.t); S.msg=''; S.phase=S.mode==='mix'?'type':'done'; }
    else{ S.oops='o'+b.dataset.k; missHint(q); }
    return render();
  }
  if(a==='type'&&S.phase==='type'){
    if(b.dataset.t===q.t){ if(S.typeMiss===0)S.pts++; S.msg=''; S.phase='done'; }
    else{ S.oops='t'+b.dataset.t; S.typeMiss++; S.msg="Look again. Is it about the opening (Topic Sentence), explaining the why (Elaborate), or linking points (Connect & Conclude)?"; }
    return render();
  }
  if(a==='next'){
    S.stars+=S.pts;
    if(S.i<S.qs.length-1){S.i++;return setupQ()}
    return finish();
  }
});
function finish(){
  stats.cases++; stats.stars+=S.stars; save();
  try{localStorage.setItem('hw-done-paragraphs',new Date().toISOString().slice(0,10))}catch(e){}
  const pct=S.max?S.stars/S.max:0, on=Math.min(5,Math.round(pct*5));
  const head=pct>=.9?"Amazing!":pct>=.6?"Nice work!":"Good work sticking with it!";
  const rules=[...S.missed].map(t=>`<li><b class="c-${t}">${NAME[t]}:</b> ${RULE[t]}</li>`).join('');
  app.innerHTML=`
  <section class="card center">
    <span class="label">Results</span>
    <h2>${head}</h2>
    <div class="stars pop" aria-hidden="true">${'★'.repeat(on)}<span class="off">${'★'.repeat(5-on)}</span></div>
    <p><b>${S.stars}</b> of ${S.max} stars</p>
  </section>
  ${rules?`<section class="card"><span class="label">Rules to remember</span><ul class="rules">${rules}</ul></section>`:''}
  <button class="big-btn" data-act="start" data-mode="${S.mode}"><div>Another round<small>Same skill, new questions</small></div><span aria-hidden="true">→</span></button>
  <button class="back" data-act="home">← Home</button>`;
}
home();
</script>
{% endraw %}
