---
title: Writing Detective
layout: default
---

{% raw %}
<div id="app"></div>
<p class="quiz-nav"><a href="./">Study guide</a> · <a href="../">All subjects</a></p>

<style>
/* Quiz UI, themed to sit inside the cayman page. Color = skill:
   Sentences pink, Homophones blue, Explain It teal. */
#app{max-width:640px;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:20px}
#app *{box-sizing:border-box}
.quiz-nav{text-align:center;margin-top:28px}
:root{
  --bg:#F7F8FC; --card:#FFFFFF; --ink:#1A2042; --muted:#5B6386; --line:#DCE0EC; --hover:#EEF1F8;
  --sentence:#BE185D; --sentence-soft:#FBE0EC; --homophone:#2563EB; --homophone-soft:#E1EAFC; --explain:#0D9488; --explain-soft:#D6F0EC;
  --hl:#FFE14D; --hl-ink:#1A2042; --miss:#D93A4A; --miss-soft:#FCE4E7; --good:#0D9488;
}
#app, #app button{font-family:inherit}
#app p{margin:0}
#app button{color:inherit;cursor:pointer;border:0;background:none}
#app button:focus-visible{outline:3px solid var(--sentence);outline-offset:2px}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .1em}
.intro{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.big-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;font-weight:600;font-size:1.15rem;transition:transform .12s}
.big-btn small{display:block;font-weight:400;font-size:.85rem;opacity:.8}
.big-btn:hover{transform:translateY(-2px)}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{border-radius:14px;padding:14px 10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic span{font-size:.72rem;font-weight:400}
.t-sentence{background:var(--sentence-soft);color:var(--sentence)} .t-homophone{background:var(--homophone-soft);color:var(--homophone)} .t-explain{background:var(--explain-soft);color:var(--explain)}
.c-sentence{color:var(--sentence)} .c-homophone{color:var(--homophone)} .c-explain{color:var(--explain)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{padding:8px 10px;border-radius:10px;color:var(--muted);font-size:.95rem}
.back:hover{background:var(--hover)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)} .dot.now{background:var(--ink)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.badge.mystery{background:var(--hover);color:var(--muted)}
.badge.t-sentence{background:var(--sentence-soft);color:var(--sentence)} .badge.t-homophone{background:var(--homophone-soft);color:var(--homophone)} .badge.t-explain{background:var(--explain-soft);color:var(--explain)}
.prompt{font-weight:600;font-size:1.2rem;line-height:1.35}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:1.02rem;background:var(--card);min-height:52px;text-align:left}
.choice:hover{border-color:var(--ink)}
.choice.t-sentence{background:var(--sentence-soft)} .choice.t-homophone{background:var(--homophone-soft)} .choice.t-explain{background:var(--explain-soft)}
.choice.oops{border-color:var(--miss);animation:shake .35s}
.hint{background:var(--hover);border-radius:12px;padding:12px 14px;font-size:.95rem}
.hint b{font-weight:600}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.result.sentence{background:var(--sentence-soft)} .result.homophone{background:var(--homophone-soft)} .result.explain{background:var(--explain-soft)}
.result strong{font-weight:800;font-size:1.2rem}
.answerline{font-weight:600}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600;font-size:1.1rem}
.stars{font-size:2.2rem;letter-spacing:4px;color:#E8B400}
.stars .off{color:var(--line)}
.pop{animation:pop .4s}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.center{align-items:center;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.topics{grid-template-columns:1fr}.topic{flex-direction:row;justify-content:space-between;padding:14px 16px}}
</style>

<script>
const BANK=[
 // SENTENCES — complete / fragment / run-on
 {t:'sentence',q:"What is this? \"Early humans hunted animals for food.\"",a:"Complete sentence",o:["Fragment","Run-on","A question"],why:"It has a WHO (early humans) and a DID WHAT (hunted animals). Complete."},
 {t:'sentence',q:"What is this? \"Because I forgot my notebook.\"",a:"Fragment",o:["Complete sentence","Run-on","A question"],why:"A 'because' piece by itself can't stand alone — it's a fragment. Add a WHO + DID WHAT."},
 {t:'sentence',q:"What is this? \"We did the gum lab it was really fun.\"",a:"Run-on",o:["Complete sentence","Fragment","A question"],why:"Two sentences squished together. Split with a period, or join with ', and'."},
 {t:'sentence',q:"What is this? \"Running down the hallway after lunch.\"",a:"Fragment",o:["Complete sentence","Run-on","Two sentences"],why:"No subject doing a main action. Add a WHO + DID WHAT: 'Jake got in trouble for running…'."},
 {t:'sentence',q:"Which is the best fix? \"My team lost the game we still had fun.\"",a:"My team lost the game, but we still had fun.",o:["My team lost the game we still, had fun.","My team lost the game we still had fun!","My team, lost the game we still had fun."],why:"Two complete ideas that contrast — join with ', but' (or split with a period)."},
 {t:'sentence',q:"Which one is a COMPLETE sentence?",a:"The ball rolled across the floor.",o:["On the coordinate plane.","Newton's first law.","After the long game."],why:"Only this has a WHO (the ball) and a DID WHAT (rolled). The others are fragments."},
 // HOMOPHONES
 {t:'homophone',q:"Choose the right word: \"I have ___ pencils in my bag.\"",a:"two",o:["too","to","tow"],why:"two = 2. (too = also/very; to = toward.)"},
 {t:'homophone',q:"Choose the right word: \"This homework is ___ hard!\"",a:"too",o:["two","to","toe"],why:"too = very or also. 'Too hard' means very hard."},
 {t:'homophone',q:"Choose the right words: \"___ going to finish ___ project.\"",a:"They're / their",o:["Their / they're","There / their","They're / there"],why:"They're = they are; their = they own it. 'They're going to finish their project.'"},
 {t:'homophone',q:"Choose the right word: \"Put the book over ___.\"",a:"there",o:["their","they're","thare"],why:"there has 'here' inside it — it names a place."},
 {t:'homophone',q:"Choose the right word: \"___ a great writer.\"",a:"You're",o:["Your","Yore","Youre"],why:"You're = you are. 'You are a great writer.'"},
 {t:'homophone',q:"Choose the right word: \"The dog wagged ___ tail.\"",a:"its",o:["it's","its'","it is"],why:"its = belonging to it (no apostrophe). it's = it is."},
 // EXPLAIN IT — ACE / stronger answers
 {t:'explain',q:"A strong written answer STARTS by…",a:"restating the question in a complete sentence",o:["writing \"Because…\"","giving just the number","listing only the steps"],why:"Restate the question first: 'My favorite class is…'. Never start an answer with 'Because'."},
 {t:'explain',q:"Which answer is stronger? Q: \"Is 4:10 equivalent to 2:5?\"",a:"Yes. If I divide both 4 and 10 by 2, I get 2 and 5, so the ratio is the same.",o:["Yes. Divide.","Yes, because math.","4:10"],why:"ACE: it restates the answer, shows the math, and explains why. 'Yes. Divide.' shows and explains nothing."},
 {t:'explain',q:"What's missing? \"Store B is cheaper.\" (Q: which store is the better deal?)",a:"The math and the why (how you know)",o:["Nothing — it's complete","A capital letter","A question mark"],why:"ACE needs Calculate + Explain: '$1.50 per notebook vs $1.40, so B costs less for each one.'"},
 {t:'explain',q:"Which sentence EXPANDS with details (the +E in CUPS+E)?",a:"Yesterday, my neighbor's dog ran across the park to chase a squirrel.",o:["The dog ran.","Dog ran fast.","It ran."],why:"+Expand adds when/where/why. The short ones leave the details out."},
 {t:'explain',q:"Jordan says 4 tacos cost $10, so 6 tacos cost $12 (he added 2). What is the real cost?",a:"$15 — ratios multiply, not add",o:["$12","$14","$10"],why:"Unit rate is $10 ÷ 4 = $2.50 per taco, so 6 × $2.50 = $15."},
 {t:'explain',q:"Which explanation uses LABELS, not bare numbers?",a:"The 2-pack is $3 for 2 juice boxes, which is $1.50 per box.",o:["It's 3 and 2, so 1.5.","1.50 is less.","I did division."],why:"Label the numbers (dollars, boxes) so a reader who didn't see your work understands."}
];
const NAME={sentence:"Sentences",homophone:"Homophones",explain:"Explain It"};
const HINT={
 sentence:"<b>Sentences:</b> a complete sentence has a WHO + DID WHAT. A fragment is missing one. A run-on squishes two sentences together — split with a period or join with ', and / , but / , so'.",
 homophone:"<b>Homophones:</b> two = 2 · too = also/very · to = toward. there = a place (has 'here') · their = they own it · they're = they are. you're = you are · its = belongs to it.",
 explain:"<b>Explain it (ACE):</b> Answer in a full sentence that restates the question, Calculate/show it with labels, and Explain why. Never start with 'Because'."
};
const RULE={
 sentence:"Complete sentence = WHO + DID WHAT. Fragment = missing one. Run-on = two sentences joined wrong (split, or use , and / , but / , so).",
 homophone:"two=2, too=also/very, to=toward · there=place, their=they own, they're=they are · you're=you are, its=belongs to it.",
 explain:"ACE: Answer (restate the question) · Calculate with labels · Explain why. Start by restating; never start with 'Because'."
};

const app=document.getElementById('app');
let S=null;
const stats=load();
function load(){try{return JSON.parse(localStorage.getItem('wd-stats'))||{cases:0,stars:0}}catch(e){return{cases:0,stars:0}}}
function save(){try{localStorage.setItem('wd-stats',JSON.stringify(stats))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function home(){
  S=null;
  app.innerHTML=`
  <p class="intro muted">Slow down. Full sentences. Check it. Short rounds — about 3 minutes.</p>
  <button class="big-btn" data-act="start" data-mode="mix">
    <div>Quick case<small>5 questions · all three skills · about 3 minutes</small></div><span aria-hidden="true">→</span>
  </button>
  <div class="card">
    <span class="label">Practice one skill (6 questions)</span>
    <div class="topics">
      <button class="topic t-sentence" data-act="start" data-mode="sentence">Sentences<span>complete · fragment · run-on</span></button>
      <button class="topic t-homophone" data-act="start" data-mode="homophone">Homophones<span>to · too · two</span></button>
      <button class="topic t-explain" data-act="start" data-mode="explain">Explain It<span>ACE · restate</span></button>
    </div>
  </div>
  <div class="card">
    <span class="label">How a case works</span>
    <ol class="steps">
      <li><span><b>Read</b> the question and <b>pick</b> the answer.</span></li>
      <li><span>Every answer gives you the <b>why</b> — the rule to remember.</span></li>
      <li><span>In a quick case, <b>name the skill</b> for a bonus star.</span></li>
    </ol>
    <div class="stats muted"><span>Cases closed: <b>${stats.cases}</b></span><span>Stars earned: <b>${stats.stars}</b> ★</span></div>
  </div>`;
}

function start(mode){
  const pool=mode==='mix'?BANK:BANK.filter(q=>q.t===mode);
  const n=mode==='mix'?5:6;
  S={mode,qs:shuffle(pool).slice(0,n),i:0,stars:0,max:0,missed:new Set()};
  setupQ();
}
function setupQ(){
  const q=S.qs[S.i];
  Object.assign(S,{phase:'answer',miss:0,typeMiss:0,msg:'',opts:shuffle([q.a,...q.o]),pts:0,oops:null});
  S.max+=S.mode==='mix'?2:1;
  render();
}
function render(){
  const q=S.qs[S.i], mix=S.mode==='mix', ph=S.phase;
  const dots=S.qs.map((_,k)=>`<span class="dot ${k<S.i?'done':k===S.i?'now':''}"></span>`).join('');
  let body='';
  if(ph==='answer'){
    body=`<p class="prompt">${esc(q.q)}</p>
    <div class="choices">${S.opts.map((o,k)=>`<button class="choice ${S.oops==='o'+k?'oops':''}" data-act="answer" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  }else if(ph==='type'){
    body=`<p class="prompt">Bonus star: what skill was that question?</p>
    <div class="choices">${['sentence','homophone','explain'].map(t=>`<button class="choice t-${t} ${S.oops==='t'+t?'oops':''}" data-act="type" data-t="${t}">${NAME[t]}</button>`).join('')}</div>`;
  }else{
    const of=mix?2:1;
    body=`<p class="prompt">${esc(q.q)}</p>
    <p class="answerline c-${q.t}">✓ ${esc(q.a)}</p>
    <div class="result ${q.t}"><strong class="pop">${S.pts===of?'Case cracked!':S.pts>0?'Solved!':'Solved with help.'} ${'★'.repeat(S.pts)}</strong><p>${esc(q.why)}</p></div>
    <button class="next" data-act="next">${S.i<S.qs.length-1?'Next question →':'See my results →'}</button>`;
  }
  const badge=(!mix||ph==='done')?`<span class="badge t-${q.t}">${NAME[q.t]}</span>`:`<span class="badge mystery">Mystery skill</span>`;
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="home">← Home</button><div class="dots" role="img" aria-label="Question ${S.i+1} of ${S.qs.length}">${dots}</div><span class="score">★ ${S.stars}</span></div>
  <section class="card">${badge}${body}${S.msg?`<div class="hint" role="status">${S.msg}</div>`:''}</section>`;
  S.oops=null;
}
function missHint(q){
  S.miss++;
  if(S.miss===1)S.msg="Not quite — read it again slowly, out loud in a whisper.";
  else S.msg=HINT[q.t];
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='home')return home();
  if(a==='start')return start(b.dataset.mode);
  const q=S&&S.qs[S.i]; if(!q)return;
  if(a==='answer'&&S.phase==='answer'){
    const o=S.opts[+b.dataset.k];
    if(o===q.a){ if(S.miss===0)S.pts++; else S.missed.add(q.t); S.msg=''; S.phase=S.mode==='mix'?'type':'done'; }
    else{ S.oops='o'+b.dataset.k; missHint(q); }
    return render();
  }
  if(a==='type'&&S.phase==='type'){
    if(b.dataset.t===q.t){ if(S.typeMiss===0)S.pts++; S.msg=''; S.phase='done'; }
    else{ S.oops='t'+b.dataset.t; S.typeMiss++; S.msg="Look again. Is it about a sentence's shape (Sentences), a sound-alike word (Homophones), or writing a strong answer (Explain It)?"; }
    return render();
  }
  if(a==='next'){
    S.stars+=S.pts;
    if(S.i<S.qs.length-1){S.i++;return setupQ()}
    return finish();
  }
});
function finish(){
  stats.cases++; stats.stars+=S.stars; save();
  const pct=S.max?S.stars/S.max:0, on=Math.min(5,Math.round(pct*5));
  const head=pct>=.9?"Master detective!":pct>=.6?"Case closed!":"Case closed. Good work sticking with it!";
  const rules=[...S.missed].map(t=>`<li><b class="c-${t}">${NAME[t]}:</b> ${RULE[t]}</li>`).join('');
  app.innerHTML=`
  <section class="card center">
    <span class="label">Results</span>
    <h2>${head}</h2>
    <div class="stars pop" aria-hidden="true">${'★'.repeat(on)}<span class="off">${'★'.repeat(5-on)}</span></div>
    <p><b>${S.stars}</b> of ${S.max} stars</p>
  </section>
  ${rules?`<section class="card"><span class="label">Rules to remember</span><ul class="rules">${rules}</ul></section>`:''}
  <button class="big-btn" data-act="start" data-mode="${S.mode}"><div>Another case<small>Same skill, new questions</small></div><span aria-hidden="true">→</span></button>
  <button class="back" data-act="home">← Home</button>`;
}
home();
</script>
{% endraw %}
