---
title: Percent Increase & Decrease
layout: default
---

{% raw %}
<div id="app"></div>
<p class="quiz-nav"><a href="guide.html">Study guide</a> · <a href="../math/">All math lessons</a></p>

<style>
#app{max-width:640px;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:20px}
#app *{box-sizing:border-box}
.quiz-nav{text-align:center;margin-top:28px}
:root{
  --bg:#F7F8FC; --card:#FFFFFF; --ink:#1A2042; --muted:#5B6386; --line:#DCE0EC; --hover:#EEF1F8;
  --one:#4F46E5; --one-soft:#E6E6FB; --two:#0E7490; --two-soft:#D7EEF4; --three:#B45309; --three-soft:#FBEAD2;
  --hl:#FFE14D; --miss:#D93A4A; --good:#4F46E5;
}
#app, #app button{font-family:inherit}
#app p{margin:0}
#app button{color:inherit;cursor:pointer;border:0;background:none}
#app button:focus-visible{outline:3px solid var(--one);outline-offset:2px}
.muted{color:var(--muted)}
.intro{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.big-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;font-weight:600;font-size:1.15rem;transition:transform .12s}
.big-btn small{display:block;font-weight:400;font-size:.85rem;opacity:.8}
.big-btn:hover{transform:translateY(-2px)}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{border-radius:14px;padding:14px 10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic span{font-size:.72rem;font-weight:400}
.t-one{background:var(--one-soft);color:var(--one)} .t-two{background:var(--two-soft);color:var(--two)} .t-three{background:var(--three-soft);color:var(--three)}
.c-one{color:var(--one)} .c-two{color:var(--two)} .c-three{color:var(--three)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{padding:8px 10px;border-radius:10px;color:var(--muted);font-size:.95rem}
.back:hover{background:var(--hover)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)} .dot.now{background:var(--ink)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.badge.mystery{background:var(--hover);color:var(--muted)}
.badge.t-one{background:var(--one-soft);color:var(--one)} .badge.t-two{background:var(--two-soft);color:var(--two)} .badge.t-three{background:var(--three-soft);color:var(--three)}
.prompt{font-weight:600;font-size:1.2rem;line-height:1.35}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice{border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:1.05rem;background:var(--card);min-height:52px;text-align:left}
.choice:hover{border-color:var(--ink)}
.choice.t-one{background:var(--one-soft)} .choice.t-two{background:var(--two-soft)} .choice.t-three{background:var(--three-soft)}
.choice.oops{border-color:var(--miss);animation:shake .35s}
.hint{background:var(--hover);border-radius:12px;padding:12px 14px;font-size:.95rem}
.hint b{font-weight:600}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.result.one{background:var(--one-soft)} .result.two{background:var(--two-soft)} .result.three{background:var(--three-soft)}
.result strong{font-weight:800;font-size:1.2rem}
.answerline{font-weight:600}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600;font-size:1.1rem}
.stars{font-size:2.2rem;letter-spacing:4px;color:#E8B400}
.stars .off{color:var(--line)}
.pop{animation:pop .4s}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.center{align-items:center;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.topics{grid-template-columns:1fr}.topic{flex-direction:row;justify-content:space-between;padding:14px 16px}}
</style>

<script>
/* ===== per-quiz config ===== */
const SLUG='percent-change';
const NAME={one:"Percent of a #",two:"Increase / Decrease",three:"What percent?"};
const SUB={one:"20% of 50",two:"tax · tip · discount",three:"change ÷ original"};
const HINT={
 one:"<b>Percent of a number:</b> turn the percent into a decimal (÷ 100), then multiply. 20% of 50 = 0.20 × 50 = 10.",
 two:"<b>Increase/Decrease:</b> find the change (% × original), then ADD for tax/tip/markup or SUBTRACT for a discount.",
 three:"<b>What percent?</b> percent change = change ÷ original × 100."
};
const RULE={
 one:"Percent of a number = decimal × number.",
 two:"Change = % × original; add (tax/tip) or subtract (discount).",
 three:"Percent change = change ÷ original × 100."
};
const BANK=[
 {t:'one',q:"20% of 50?",a:"10",o:["70","30","1000"],why:"0.20 × 50 = 10."},
 {t:'one',q:"30% of 90?",a:"27",o:["3","60","270"],why:"0.30 × 90 = 27."},
 {t:'one',q:"7% of 200?",a:"14",o:["7","1.4","140"],why:"0.07 × 200 = 14."},
 {t:'one',q:"To find a percent of a number, first…",a:"turn the percent into a decimal",o:["add 100","divide by the percent","multiply by 100"],why:"Move the point 2 places left, then multiply."},
 {t:'one',q:"50% of 48?",a:"24",o:["96","12","50"],why:"50% = half, so 48 ÷ 2 = 24."},
 {t:'two',q:"A $60 jacket is 20% off. Final price?",a:"$48",o:["$12","$72","$40"],why:"Change = 0.20 × 60 = $12; 60 − 12 = $48."},
 {t:'two',q:"A $25 meal with 8% tax. Total?",a:"$27",o:["$33","$2","$23"],why:"Tax = 0.08 × 25 = $2; 25 + 2 = $27."},
 {t:'two',q:"A $40 meal with a 15% tip. Total?",a:"$46",o:["$6","$55","$34"],why:"Tip = 0.15 × 40 = $6; 40 + 6 = $46."},
 {t:'two',q:"For a 25% discount, multiply the price by…",a:"0.75",o:["0.25","1.25","1.75"],why:"Keeping 75% means × 0.75."},
 {t:'two',q:"A $200 bike marked up 10%. New price?",a:"$220",o:["$210","$180","$2000"],why:"Markup = 0.10 × 200 = $20; 200 + 20 = $220."},
 {t:'two',q:"A discount means you…",a:"subtract the change",o:["add the change","multiply by the percent","ignore the percent"],why:"A discount lowers the price, so subtract."},
 {t:'three',q:"A price goes $20 → $25. Percent increase?",a:"25%",o:["5%","20%","125%"],why:"Change $5 ÷ original $20 = 0.25 = 25%."},
 {t:'three',q:"A plant grows 40 cm → 50 cm. Percent increase?",a:"25%",o:["10%","20%","80%"],why:"Change 10 ÷ 40 = 0.25 = 25%."},
 {t:'three',q:"Percent change is the change divided by…",a:"the original amount",o:["the new amount","100","the change"],why:"Divide the change by the original, then × 100."},
 {t:'three',q:"$50 drops to $40. Percent decrease?",a:"20%",o:["10%","25%","80%"],why:"Change $10 ÷ original $50 = 0.20 = 20%."}
];
/* ===== shared engine ===== */
const KEYS=['one','two','three'];
const app=document.getElementById('app');
let S=null;
const stats=load();
function load(){try{return JSON.parse(localStorage.getItem('q-'+SLUG))||{cases:0,stars:0}}catch(e){return{cases:0,stars:0}}}
function save(){try{localStorage.setItem('q-'+SLUG,JSON.stringify(stats))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function home(){
  S=null;
  app.innerHTML=`
  <p class="intro muted">Read the question, pick the answer, and learn the why. Short rounds — about 3 minutes.</p>
  <button class="big-btn" data-act="start" data-mode="mix"><div>Quick round<small>5 questions · all three topics</small></div><span aria-hidden="true">→</span></button>
  <div class="card"><span class="label">Practice one topic (6 questions)</span>
    <div class="topics">${KEYS.map(t=>`<button class="topic t-${t}" data-act="start" data-mode="${t}">${NAME[t]}<span>${SUB[t]}</span></button>`).join('')}</div>
  </div>
  <div class="card"><span class="label">How it works</span>
    <ol class="steps"><li><span><b>Read</b> and <b>pick</b> the answer.</span></li><li><span>Every answer shows the <b>why</b>.</span></li><li><span>In a quick round, <b>name the topic</b> for a bonus star.</span></li></ol>
    <div class="stats muted"><span>Rounds done: <b>${stats.cases}</b></span><span>Stars earned: <b>${stats.stars}</b> ★</span></div>
  </div>`;
}
function start(mode){const pool=mode==='mix'?BANK:BANK.filter(q=>q.t===mode);const n=mode==='mix'?5:6;S={mode,qs:shuffle(pool).slice(0,n),i:0,stars:0,max:0,missed:new Set()};setupQ();}
function setupQ(){const q=S.qs[S.i];Object.assign(S,{phase:'answer',miss:0,typeMiss:0,msg:'',opts:shuffle([q.a,...q.o]),pts:0,oops:null});S.max+=S.mode==='mix'?2:1;render();}
function render(){
  const q=S.qs[S.i], mix=S.mode==='mix', ph=S.phase;
  const dots=S.qs.map((_,k)=>`<span class="dot ${k<S.i?'done':k===S.i?'now':''}"></span>`).join('');
  let body='';
  if(ph==='answer'){body=`<p class="prompt">${esc(q.q)}</p><div class="choices">${S.opts.map((o,k)=>`<button class="choice ${S.oops==='o'+k?'oops':''}" data-act="answer" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;}
  else if(ph==='type'){body=`<p class="prompt">Bonus star: what topic was that?</p><div class="choices">${KEYS.map(t=>`<button class="choice t-${t} ${S.oops==='t'+t?'oops':''}" data-act="type" data-t="${t}">${NAME[t]}</button>`).join('')}</div>`;}
  else{const of=mix?2:1;body=`<p class="prompt">${esc(q.q)}</p><p class="answerline c-${q.t}">✓ ${esc(q.a)}</p><div class="result ${q.t}"><strong class="pop">${S.pts===of?'Perfect!':S.pts>0?'Nice!':'Got it.'} ${'★'.repeat(S.pts)}</strong><p>${esc(q.why)}</p></div><button class="next" data-act="next">${S.i<S.qs.length-1?'Next question →':'See my results →'}</button>`;}
  const badge=(!mix||ph==='done')?`<span class="badge t-${q.t}">${NAME[q.t]}</span>`:`<span class="badge mystery">Mixed</span>`;
  app.innerHTML=`<div class="topbar"><button class="back" data-act="home">← Home</button><div class="dots" role="img" aria-label="Question ${S.i+1} of ${S.qs.length}">${dots}</div><span class="score">★ ${S.stars}</span></div><section class="card">${badge}${body}${S.msg?`<div class="hint" role="status">${S.msg}</div>`:''}</section>`;
  S.oops=null;
}
function missHint(q){S.miss++;S.msg=S.miss===1?"Not quite — read it again slowly. What is it really asking?":HINT[q.t];}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='home')return home();
  if(a==='start')return start(b.dataset.mode);
  const q=S&&S.qs[S.i]; if(!q)return;
  if(a==='answer'&&S.phase==='answer'){const o=S.opts[+b.dataset.k];if(o===q.a){if(S.miss===0)S.pts++;else S.missed.add(q.t);S.msg='';S.phase=S.mode==='mix'?'type':'done';}else{S.oops='o'+b.dataset.k;missHint(q);}return render();}
  if(a==='type'&&S.phase==='type'){if(b.dataset.t===q.t){if(S.typeMiss===0)S.pts++;S.msg='';S.phase='done';}else{S.oops='t'+b.dataset.t;S.typeMiss++;S.msg="Look again. Which topic — "+NAME.one+", "+NAME.two+", or "+NAME.three+"?";}return render();}
  if(a==='next'){S.stars+=S.pts;if(S.i<S.qs.length-1){S.i++;return setupQ()}return finish();}
});
function finish(){
  stats.cases++; stats.stars+=S.stars; save();
  try{localStorage.setItem('hw-done-'+SLUG,new Date().toISOString().slice(0,10))}catch(e){}
  const pct=S.max?S.stars/S.max:0, on=Math.min(5,Math.round(pct*5));
  const head=pct>=.9?"Amazing!":pct>=.6?"Nice work!":"Good work sticking with it!";
  const rules=[...S.missed].map(t=>`<li><b class="c-${t}">${NAME[t]}:</b> ${RULE[t]}</li>`).join('');
  app.innerHTML=`<section class="card center"><span class="label">Results</span><h2>${head}</h2><div class="stars pop" aria-hidden="true">${'★'.repeat(on)}<span class="off">${'★'.repeat(5-on)}</span></div><p><b>${S.stars}</b> of ${S.max} stars</p></section>${rules?`<section class="card"><span class="label">Rules to remember</span><ul class="rules">${rules}</ul></section>`:''}<button class="big-btn" data-act="start" data-mode="${S.mode}"><div>Another round<small>Same topic, new questions</small></div><span aria-hidden="true">→</span></button><button class="back" data-act="home">← Home</button>`;
}
home();
</script>
{% endraw %}
